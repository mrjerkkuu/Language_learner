# Builds the Vite app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". After that, every push to main auto-deploys to
# https://mrjerkkuu.github.io/Language_learner/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

# Permissions the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # LTS, required by Vite
          cache: npm
      - run: npm ci
      - run: npm run test # unit + data-integrity tests; a failure blocks the deploy
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Vite's build output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
