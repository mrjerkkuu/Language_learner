<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: the page scales to the device width. viewport-fit=cover
         lets content extend into the notch/safe areas on modern phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5ba5" />
    <meta name="description" content="Työelämän ruotsi — oma harjoittelusovellus" />
    <title>Työelämän ruotsi</title>

    <!-- Design system fonts: Space Grotesk (headings/numbers) + IBM Plex Sans
         (body/UI). preconnect speeds up the font fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts into this element (see src/main.jsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
